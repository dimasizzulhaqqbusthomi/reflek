<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Profil - REFLEK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap");
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      input:focus {
        outline: none;
        border-color: #10b981;
        ring: 2px;
        ring-color: #ecfdf5;
      }
    </style>
  </head>
  <body class="bg-gray-50 flex justify-center min-h-screen text-gray-800">
    <div class="max-w-md w-full bg-white shadow-2xl flex flex-col h-screen relative overflow-hidden">
      <header class="sticky top-0 z-30 bg-white px-6 pt-12 pb-4 border-b border-gray-50 flex items-center justify-between">
        <div class="flex items-center gap-4">
          <button onclick="history.back()" class="text-gray-800">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
          <h1 class="text-sm font-bold tracking-tight uppercase italic text-emerald-600">Edit Profil</h1>
        </div>
        <button onclick="saveProfile()" class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest italic">Simpan</button>
      </header>

      <main class="flex-grow overflow-y-auto no-scrollbar px-6 py-8">
        <div class="flex flex-col items-center mb-10">
          <div class="relative group">
            <div class="w-28 h-28 rounded-[40px] bg-gray-100 p-1 shadow-inner overflow-hidden border-2 border-emerald-50">
              <img
                id="profile-img"
                src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80"
                class="w-full h-full object-cover rounded-[36px]"
              />
            </div>
            <label
              for="avatar-upload"
              class="absolute -bottom-2 -right-2 bg-emerald-600 text-white w-10 h-10 rounded-2xl flex items-center justify-center shadow-lg cursor-pointer hover:bg-emerald-700 transition-all border-4 border-white"
            >
              <i class="fa-solid fa-camera text-xs"></i>
            </label>
            <input type="file" id="avatar-upload" class="hidden" accept="image/*" onchange="previewImage(event)" />
          </div>
          <p class="text-[9px] font-bold text-gray-400 uppercase tracking-widest mt-4 italic">Ketuk untuk ubah foto</p>
        </div>

        <div class="space-y-6">
          <div class="space-y-2">
            <label class="text-[9px] font-bold text-gray-400 uppercase tracking-[0.2em] ml-1 italic">Nama Lengkap</label>
            <input
              type="text"
              value="Adrian Ferdinand"
              class="w-full p-4 bg-gray-50 rounded-2xl border border-gray-100 text-[11px] font-bold italic text-gray-700 transition-all focus:bg-white focus:shadow-sm"
            />
          </div>

          <div class="space-y-2">
            <label class="text-[9px] font-bold text-gray-400 uppercase tracking-[0.2em] ml-1 italic">Email</label>
            <input
              type="email"
              value="adrian.ferdinand@reflek.com"
              class="w-full p-4 bg-gray-50 rounded-2xl border border-gray-100 text-[11px] font-bold italic text-gray-700 transition-all focus:bg-white focus:shadow-sm"
            />
          </div>

          <div class="space-y-2">
            <label class="text-[9px] font-bold text-gray-400 uppercase tracking-[0.2em] ml-1 italic">Nomor Telepon</label>
            <div class="relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-[11px] font-bold text-gray-400">+62</span>
              <input
                type="tel"
                value="81234567890"
                class="w-full p-4 pl-12 bg-gray-50 rounded-2xl border border-gray-100 text-[11px] font-bold italic text-gray-700 transition-all focus:bg-white focus:shadow-sm"
              />
            </div>
          </div>

          <div class="space-y-2">
            <label class="text-[9px] font-bold text-gray-400 uppercase tracking-[0.2em] ml-1 italic">Bio Singkat</label>
            <textarea
              class="w-full p-4 bg-gray-50 rounded-2xl border border-gray-100 text-[11px] font-bold italic text-gray-700 h-24 resize-none transition-all focus:bg-white focus:shadow-sm"
            >
Belanja lokal untuk bumi yang lebih baik. 🌱</textarea
            >
          </div>
        </div>

        <div class="mt-10 pt-6 border-t border-dashed border-gray-100">
          <button
            onclick="window.location.href='ubah-kata-sandi.html'"
            class="w-full flex items-center justify-between p-4 bg-gray-50 rounded-2xl hover:bg-gray-100 transition-all"
          >
            <div class="flex items-center gap-4">
              <i class="fa-solid fa-lock text-emerald-600 text-xs"></i>
              <span class="text-[10px] font-bold italic">Ubah Kata Sandi</span>
            </div>
            <i class="fa-solid fa-chevron-right text-[10px] text-gray-300"></i>
          </button>
        </div>
      </main>
    </div>

    <script>
      function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function () {
          const output = document.getElementById("profile-img");
          output.src = reader.result;
        };
        reader.readAsDataURL(event.target.files[0]);
      }

      function saveProfile() {
        // Animasi feedback sederhana
        const btn = event.target;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin"></i>';

        setTimeout(() => {
          alert("Profil berhasil diperbarui!");
          window.location.href = "profile.html";
        }, 1000);
      }
    </script>
  </body>
</html>
