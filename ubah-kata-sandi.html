<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ubah Kata Sandi - REFLEK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap");
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      input:focus {
        outline: none;
        border-color: #10b981;
      }
    </style>
  </head>
  <body class="bg-gray-50 flex justify-center min-h-screen text-gray-800">
    <div class="max-w-md w-full bg-white shadow-2xl flex flex-col h-screen relative overflow-hidden">
      <header class="sticky top-0 z-30 bg-white px-6 pt-12 pb-4 border-b border-gray-50 flex items-center gap-4">
        <button onclick="history.back()" class="text-gray-800">
          <i class="fa-solid fa-chevron-left text-lg"></i>
        </button>
        <h1 class="text-sm font-bold tracking-tight uppercase italic text-emerald-600">Ubah Kata Sandi</h1>
      </header>

      <main class="flex-grow overflow-y-auto no-scrollbar px-6 py-8">
        <div class="mb-8">
          <h2 class="text-lg font-bold italic text-gray-800">Keamanan Akun</h2>
          <p class="text-[10px] text-gray-400 font-medium leading-relaxed mt-1">
            Pastikan kata sandi baru Anda terdiri dari minimal 8 karakter dengan kombinasi huruf dan angka untuk proteksi maksimal.
          </p>
        </div>

        <form id="password-form" class="space-y-6">
          <div class="space-y-2">
            <label class="text-[9px] font-bold text-gray-400 uppercase tracking-[0.2em] ml-1 italic">Kata Sandi Lama</label>
            <div class="relative">
              <input
                type="password"
                id="old-pass"
                placeholder="••••••••"
                class="w-full p-4 bg-gray-50 rounded-2xl border border-gray-100 text-[11px] font-bold text-gray-700 focus:bg-white focus:shadow-sm transition-all"
              />
              <button type="button" onclick="togglePass('old-pass')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-300">
                <i class="fa-solid fa-eye text-xs"></i>
              </button>
            </div>
          </div>

          <div class="space-y-2">
            <label class="text-[9px] font-bold text-gray-400 uppercase tracking-[0.2em] ml-1 italic">Kata Sandi Baru</label>
            <div class="relative">
              <input
                type="password"
                id="new-pass"
                placeholder="••••••••"
                class="w-full p-4 bg-gray-50 rounded-2xl border border-gray-100 text-[11px] font-bold text-gray-700 focus:bg-white focus:shadow-sm transition-all"
              />
              <button type="button" onclick="togglePass('new-pass')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-300">
                <i class="fa-solid fa-eye text-xs"></i>
              </button>
            </div>
          </div>

          <div class="space-y-2">
            <label class="text-[9px] font-bold text-gray-400 uppercase tracking-[0.2em] ml-1 italic">Konfirmasi Kata Sandi Baru</label>
            <div class="relative">
              <input
                type="password"
                id="confirm-pass"
                placeholder="••••••••"
                class="w-full p-4 bg-gray-50 rounded-2xl border border-gray-100 text-[11px] font-bold text-gray-700 focus:bg-white focus:shadow-sm transition-all"
              />
              <button type="button" onclick="togglePass('confirm-pass')" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-300">
                <i class="fa-solid fa-eye text-xs"></i>
              </button>
            </div>
          </div>
        </form>

        <div class="mt-4 text-right">
          <button class="text-[9px] font-bold text-emerald-600 uppercase italic underline">Lupa kata sandi?</button>
        </div>
      </main>

      <footer class="p-6 bg-white border-t border-gray-50">
        <button
          onclick="updatePassword()"
          class="w-full py-4 bg-emerald-600 text-white font-bold rounded-2xl text-[10px] uppercase italic shadow-lg shadow-emerald-100 active:scale-95 transition-all"
        >
          Simpan Kata Sandi Baru
        </button>
      </footer>
    </div>

    <script>
      function togglePass(id) {
        const input = document.getElementById(id);
        const icon = input.nextElementSibling.querySelector("i");
        if (input.type === "password") {
          input.type = "text";
          icon.classList.replace("fa-eye", "fa-eye-slash");
        } else {
          input.type = "password";
          icon.classList.replace("fa-eye-slash", "fa-eye");
        }
      }

      function updatePassword() {
        const newPass = document.getElementById("new-pass").value;
        const confirmPass = document.getElementById("confirm-pass").value;

        if (newPass === "" || confirmPass === "") {
          alert("Harap isi semua kolom!");
          return;
        }

        if (newPass !== confirmPass) {
          alert("Konfirmasi kata sandi tidak cocok!");
          return;
        }

        // Simulasi loading
        const btn = event.target;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin mr-2"></i> Memproses...';

        setTimeout(() => {
          alert("Kata sandi berhasil diperbarui!");
          window.location.href = "edit-profil.html";
        }, 1500);
      }
    </script>
  </body>
</html>
